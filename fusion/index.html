<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Autodesk Fusion Course Player</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-hover: #334155;
      --bg-active: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --watched: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar Folder Tree */
    .sidebar {
      width: 380px;
      min-width: 320px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .search-box {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent);
    }

    .progress-bar-container {
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .folder-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .folder {
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background-color: rgba(15, 23, 42, 0.4);
    }

    .folder-header {
      width: 100%;
      background: var(--bg-sidebar);
      color: var(--text-main);
      border: none;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }

    .folder-header:hover {
      background-color: var(--bg-hover);
    }

    .folder-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 8px;
      white-space: nowrap;
    }

    .folder-chevron {
      transition: transform 0.2s ease;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .folder.open .folder-chevron {
      transform: rotate(90deg);
    }

    .folder-videos {
      display: none;
      border-top: 1px solid var(--border);
    }

    .folder.open .folder-videos {
      display: block;
    }

    .video-item {
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      text-align: left;
      font-size: 0.86rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      transition: background 0.15s, color 0.15s;
    }

    .video-item:last-child {
      border-bottom: none;
    }

    .video-item:hover {
      background-color: var(--bg-hover);
      color: var(--text-main);
    }

    .video-item.active {
      background-color: var(--bg-active);
      color: #ffffff;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--border);
      flex-shrink: 0;
    }

    .video-item.watched .status-dot {
      background-color: var(--watched);
    }

    .video-item.active .status-dot {
      background-color: #ffffff;
    }

    /* Main Video Player Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 32px;
      overflow-y: auto;
    }

    .video-header {
      margin-bottom: 16px;
    }

    .current-folder-badge {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .current-video-title {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .player-wrapper {
      flex: 1;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border);
      min-height: 360px;
      max-height: calc(100vh - 210px);
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      outline: none;
    }

    .player-controls-bar {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      background-color: var(--bg-sidebar);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--bg-hover);
      border-color: var(--accent);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .autoplay-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
        overflow: auto;
      }
      .sidebar {
        width: 100%;
        height: 45vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .main-content {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Autodesk Fusion Course</h1>
      <input type="text" id="searchInput" class="search-box" placeholder="Search 92 lessons..." />
      <div class="progress-bar-container">
        <span id="progressText">0 / 92 completed</span>
        <span id="clearProgressBtn" style="cursor:pointer; text-decoration:underline;">Reset</span>
      </div>
    </div>
    <div class="folder-list" id="folderList"></div>
  </aside>

  <!-- Main Video Player -->
  <main class="main-content">
    <div class="video-header">
      <div class="current-folder-badge" id="currentFolderBadge">1 - Introduction</div>
      <h2 class="current-video-title" id="currentVideoTitle">1 - Course Introduction</h2>
    </div>

    <div class="player-wrapper">
      <video id="videoPlayer" controls preload="metadata"></video>
    </div>

    <div class="player-controls-bar">
      <button class="btn" id="prevBtn">&larr; Previous Lesson</button>
      <label class="autoplay-toggle">
        <input type="checkbox" id="autoplayCheck" checked />
        Autoplay next video
      </label>
      <button class="btn" id="nextBtn">Next Lesson &rarr;</button>
    </div>
  </main>

  <script>
    // =========================================================================
    // 1. CONFIGURE YOUR PUBLIC CLOUDFLARE R2 URL HERE
    // Paste your public r2.dev link (Settings -> Public Development URL in R2)
    // =========================================================================
    const R2_PUBLIC_URL = "https://pub-ba3089e2a5554e9aa860c962966d16b8.r2.dev";

    // Set to true ONLY if your files inside R2 are stored inside folder paths
    // like: https://pub-xxx.r2.dev/1%20-%20Introduction/1%20-%20Course%20Introduction.mp4
    const USE_R2_SUBFOLDERS = false;

    // =========================================================================
    // 2. COURSE FOLDER STRUCTURE (All 92 Videos)
    // =========================================================================
    const courseData = [
      {
        folder: "1 - Introduction",
        files: [
          "1 - Course Introduction.mp4",
          "2 - Downloading Autodesk Fusion.mp4"
        ]
      },
      {
        folder: "2 - Setting up your Workspace",
        files: [
          "3 - Section Introduction.mp4",
          "4 - User Interface.mp4",
          "5 - Create your First Project.mp4",
          "6 - Setting Units Grid Environment Settings.mp4"
        ]
      },
      {
        folder: "3 - 2D Sketching",
        files: [
          "7 - Section Introduction.mp4",
          "8 - Planes Lines Dimensions.mp4",
          "9 - Rectangle Tools.mp4",
          "10 - Circle Tools.mp4",
          "11 - Arc Tools.mp4",
          "12 - Slot Tools.mp4",
          "13 - Polygons Tools.mp4",
          "14 - Fillet Chamfer Tools.mp4",
          "15 - Text Tools.mp4",
          "16 - Modification Tools.mp4",
          "17 - Pattern Tools Rectangular Circular Mirror.mp4",
          "18 - Dimensions Constraints.mp4",
          "19 - Construction Lines Measurement Tools.mp4",
          "20 - Sketch Assignment 1.mp4",
          "21 - Sketch Assignment 2.mp4",
          "22 - Sketch Assignment 3.mp4"
        ]
      },
      {
        folder: "4 - 3D Modelling",
        files: [
          "23 - Section Introduction.mp4",
          "24 - Extrude Extrude Cut.mp4",
          "25 - The Viewcube.mp4",
          "26 - Revolve Modelling Tool.mp4",
          "27 - Sweep Tool.mp4",
          "28 - Engraving Embossing Bodies.mp4",
          "29 - Adding Planes.mp4",
          "30 - Extruding Revolving to Objects.mp4",
          "31 - Fillet Chamfer.mp4",
          "32 - The Shell Command.mp4",
          "33 - The Hole Command Threads CBore etc.mp4",
          "34 - Applying Threads.mp4",
          "35 - Assigning Materials Appearances.mp4",
          "36 - Adding a Decal Image.mp4",
          "37 - Rendering in Fusion.mp4",
          "38 - Part Properties Mass Volume Density etc.mp4",
          "39 - How to Cross Section View.mp4",
          "40 - Export for 3D Printing.mp4",
          "41 - Modelling Assignment 1.mp4",
          "42 - Modelling Assignment 2.mp4",
          "43 - Modelling Assignment 3.mp4"
        ]
      },
      {
        folder: "5 - Creating Assemblies",
        files: [
          "44 - Section Introduction.mp4",
          "45 - Part 1 Baseplate.mp4",
          "46 - Part 2 Bracket Arms.mp4",
          "47 - Part 3 Pin.mp4",
          "48 - Part 4 Pulley.mp4",
          "49 - Placing Position of Parts.mp4",
          "50 - Using Joints in Fusion.mp4",
          "51 - Adding Parts from Fusions Content Library.mp4",
          "52 - CrossSection Views Assemblies.mp4",
          "53 - Component Body Visibility Transparency.mp4",
          "54 - Patterning Assemblies.mp4",
          "55 - Editing Existing Assemblies.mp4"
        ]
      },
      {
        folder: "6 - Project 1 Workbench",
        files: [
          "56 - Section Introduction.mp4",
          "57 - Modelling the Table Top Lower Shelf.mp4",
          "58 - Modelling the Legs.mp4",
          "59 - Modelling the Aprons.mp4",
          "60 - Modelling the Braces.mp4",
          "61 - Assembly of the Workbench.mp4"
        ]
      },
      {
        folder: "7 - Project 2 3D Printed Phone Stand",
        files: [
          "62 - Section Introduction.mp4",
          "63 - Modelling the Phone Stand.mp4",
          "64 - Modelling a Generic SmartPhone.mp4",
          "65 - Assembly of the Phone Stand.mp4",
          "66 - Export to STL file.mp4"
        ]
      },
      {
        folder: "8 - 2D Engineering Drawings",
        files: [
          "67 - Section Introduction.mp4",
          "68 - Create a 2D Technical Drawing.mp4",
          "69 - Customizing the Title Block.mp4",
          "70 - Base Views Projected Views Section Views Detailed Views.mp4",
          "71 - Switch Between 1st 3rd Angle Projections.mp4",
          "72 - View Styles Labels Leaders.mp4",
          "73 - Adding Dimensions Editing DWG Preferences.mp4",
          "74 - Adding Tolerances.mp4",
          "75 - Adding Parts Lists Ballons.mp4",
          "76 - Example 2D Engineering Drawing Bearing Block Assembly.mp4"
        ]
      },
      {
        folder: "9 - Additional Content",
        files: [
          "77 - Section Introduction.mp4",
          "78 - Coil Command Modelling Springs.mp4",
          "79 - Loft Command Loft Modelling.mp4",
          "80 - How to Split Bodies.mp4",
          "81 - Condensed Summary of Fusion 360.mp4"
        ]
      },
      {
        folder: "10 - Practice 3D Modelling Exercises",
        files: [
          "82 - Section Introduction.mp4",
          "83 - Flange Piping.mp4",
          "84 - Door Hinge.mp4",
          "85 - Elbow Pipe Bend.mp4",
          "86 - Flange Coupling Assembly.mp4",
          "87 - Paperclip Sweep.mp4",
          "88 - 3D Printed Mug Coaster Holder.mp4",
          "89 - 3D Printed Super Mario Stationary Holder.mp4",
          "90 - Wall Mounted Hook.mp4",
          "91 - 3D Modelling Exam 1.mp4",
          "92 - 3D Modelling Exam 2.mp4"
        ]
      }
    ];

    // Flatten playlist for easy Previous/Next navigation
    const flatPlaylist = [];
    courseData.forEach((section, sIdx) => {
      section.files.forEach((file) => {
        flatPlaylist.push({
          folder: section.folder,
          folderIndex: sIdx,
          file: file,
          title: file.replace(/\.mp4$/i, "")
        });
      });
    });

    let currentIndex = 0;
    let watchedVideos = JSON.parse(localStorage.getItem("fusion_watched") || "[]");

    const folderListEl = document.getElementById("folderList");
    const videoPlayer = document.getElementById("videoPlayer");
    const currentFolderBadge = document.getElementById("currentFolderBadge");
    const currentVideoTitle = document.getElementById("currentVideoTitle");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const searchInput = document.getElementById("searchInput");
    const progressText = document.getElementById("progressText");
    const clearProgressBtn = document.getElementById("clearProgressBtn");
    const autoplayCheck = document.getElementById("autoplayCheck");

    function buildVideoUrl(item) {
      const base = R2_PUBLIC_URL.replace(/\/$/, "");
      if (USE_R2_SUBFOLDERS) {
        return `${base}/${encodeURIComponent(item.folder)}/${encodeURIComponent(item.file)}`;
      }
      return `${base}/${encodeURIComponent(item.file)}`;
    }

    function updateProgressUI() {
      progressText.textContent = `${watchedVideos.length} / ${flatPlaylist.length} completed`;
    }

    function renderSidebar(filterText = "") {
      folderListEl.innerHTML = "";
      const query = filterText.trim().toLowerCase();

      courseData.forEach((section, sIdx) => {
        const matchingFiles = section.files.filter(f =>
          f.toLowerCase().includes(query) || section.folder.toLowerCase().includes(query)
        );

        if (matchingFiles.length === 0) return;

        const folderDiv = document.createElement("div");
        folderDiv.className = "folder";
        if (query || sIdx === flatPlaylist[currentIndex].folderIndex) {
          folderDiv.classList.add("open");
        }

        const headerBtn = document.createElement("button");
        headerBtn.className = "folder-header";
        headerBtn.innerHTML = `
          <span>${section.folder} <span class="folder-meta">(${section.files.length} files)</span></span>
          <span class="folder-chevron">&#9654;</span>
        `;
        headerBtn.addEventListener("click", () => {
          folderDiv.classList.toggle("open");
        });

        const videosContainer = document.createElement("div");
        videosContainer.className = "folder-videos";

        matchingFiles.forEach((file) => {
          const globalIndex = flatPlaylist.findIndex(item => item.file === file);
          const btn = document.createElement("button");
          btn.className = "video-item";
          btn.dataset.index = globalIndex;

          if (globalIndex === currentIndex) btn.classList.add("active");
          if (watchedVideos.includes(file)) btn.classList.add("watched");

          const cleanTitle = file.replace(/\.mp4$/i, "");
          btn.innerHTML = `
            <span class="status-dot"></span>
            <span>${cleanTitle}</span>
          `;

          btn.addEventListener("click", () => loadVideo(globalIndex, true));
          videosContainer.appendChild(btn);
        });

        folderDiv.appendChild(headerBtn);
        folderDiv.appendChild(videosContainer);
        folderListEl.appendChild(folderDiv);
      });

      updateProgressUI();
    }

    function loadVideo(index, autoPlay = false) {
      if (index < 0 || index >= flatPlaylist.length) return;
      currentIndex = index;
      const item = flatPlaylist[currentIndex];

      currentFolderBadge.textContent = item.folder;
      currentVideoTitle.textContent = item.title;
      videoPlayer.src = buildVideoUrl(item);

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === flatPlaylist.length - 1;

      localStorage.setItem("fusion_last_index", currentIndex);
      renderSidebar(searchInput.value);

      if (autoPlay) {
        videoPlayer.play().catch(() => {});
      }
    }

    // Mark video as watched when it finishes and optionally advance
    videoPlayer.addEventListener("ended", () => {
      const currentFile = flatPlaylist[currentIndex].file;
      if (!watchedVideos.includes(currentFile)) {
        watchedVideos.push(currentFile);
        localStorage.setItem("fusion_watched", JSON.stringify(watchedVideos));
        renderSidebar(searchInput.value);
      }
      if (autoplayCheck.checked && currentIndex < flatPlaylist.length - 1) {
        loadVideo(currentIndex + 1, true);
      }
    });

    prevBtn.addEventListener("click", () => loadVideo(currentIndex - 1, true));
    nextBtn.addEventListener("click", () => loadVideo(currentIndex + 1, true));
    searchInput.addEventListener("input", (e) => renderSidebar(e.target.value));

    clearProgressBtn.addEventListener("click", () => {
      watchedVideos = [];
      localStorage.removeItem("fusion_watched");
      renderSidebar(searchInput.value);
    });

    // Restore last watched lesson on page load
    const savedIndex = parseInt(localStorage.getItem("fusion_last_index") || "0", 10);
    loadVideo(isNaN(savedIndex) ? 0 : savedIndex, false);
  </script>
</body>
</html>
