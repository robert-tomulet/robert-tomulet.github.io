server {
    listen 80;
    server_name acesrobotics.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name acesrobotics.dev;

    root /var/www/acesrobotics.dev/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /uploads/ {
        alias /var/www/acesrobotics.dev/html/uploads/;
        expires 1M;
        add_header Cache-Control "public, immutable";
    }

    location /static {
        alias /var/www/acesrobotics.dev/html/app/static/;
        expires 1M;
        add_header Cache-Control "public, immutable";
    }

    location /articole {
        proxy_pass http://unix:/var/www/acesrobotics.dev/html/app.sock;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://unix:/var/www/acesrobotics.dev/html/app.sock;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
